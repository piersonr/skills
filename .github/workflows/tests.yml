name: Tests

# The suite is this repository's main quality asset, and until now nothing ran it
# automatically. The README tells people to install by cloning main, so main is the
# release channel: a broken push there ships to whoever installs next.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README promises Python 3.10 or newer; test the whole range it promises.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Both commands are the ones the README documents for verifying an install.
      # Neither contacts OpenRouter, so no credential is needed and no request is billed.
      - name: Unit tests
        run: python3 request-pov/scripts/test_request_pov.py
      - name: Dry run
        run: |
          python3 request-pov/scripts/request_pov.py \
            --lineage anthropic \
            --prompt "Challenge this harmless test plan" \
            --dry-run
      - name: agent-pr-review-link tests
        run: |
          python3 agent-pr-review-link/scripts/test_agent_pr_review_link.py
          python3 agent-pr-review-link/scripts/test_install.py
